# 微信支付 Api-v3 配置，可通过环境变量覆盖
v3.appId=${WXPAY_APP_ID:}
v3.mchId=${WXPAY_MCH_ID:}
v3.apiKey3=${WXPAY_API_KEY3:}
# 商户 API 私钥、商户 API 证书（含公钥）
v3.keyPath=${WXPAY_KEY_PATH:}
v3.certPath=${WXPAY_CERT_PATH:}
# 微信支付公钥文件与公钥 ID（公钥模式验签）
v3.platformCertPath=${WXPAY_PUBLIC_KEY_PATH:}
v3.publicKeyId=${WXPAY_PUBLIC_KEY_ID:}
v3.domain=${WXPAY_DOMAIN:http://localhost:8088}
